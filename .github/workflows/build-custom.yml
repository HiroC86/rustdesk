    name: Build Custom RustDesk Client (Windows)

    on:
      workflow_dispatch:  # 手动触发
      push:
        branches: [master]

    env:
      RENDEZVOUS_SERVER: ${{ secrets.RS_PUB_KEY }}
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
      PUBLIC_KEY: ${{ secrets.RS_PUB_KEY }}

    jobs:
      build-windows:
        runs-on: windows-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
              submodules: recursive

          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable

          - name: Install dependencies (vcpkg)
            run: |
              git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
              C:\vcpkg\bootstrap-vcpkg.bat
              echo set VCPKG_MANIFEST_MODE=OFF>> C:\vcpkg\triplets\x64-windows-static.cmake
              C:\vcpkg\vcpkg.exe install opus:x64-windows-static
            shell: cmd

          - name: Modify source code - embed server
            shell: python
            run: |
              import os, re, glob

              server = os.environ["RENDEZVOUS_SERVER"]
              key = os.environ["RS_PUB_KEY"]
              print(f"Embedding server: {server}")

              # Official server patterns to replace
              official_servers = [
                  "rs-sy.connectrustdesk.com",
                  "rs-syd-1.rustdesk.com",
                  "rs-syd-2.rustdesk.com",
                  "rs-us.rustdesk.com",
                  "rs-relay.rustdesk.com",
                  "connectrustdesk.com",
              ]

              def patch_file(fpath):
                  with open(fpath, "r", encoding="utf-8") as f:
                      content = f.read()
                  original = content
                  for s in official_servers:
                      content = content.replace(s, server)
                  if content != original:
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"  Patched: {os.path.relpath(fpath)}")
                      return True
                  return False

              # Scan all Rust source files
              count = 0
              for pattern in ["src/*/.rs", "libs/*/.rs", "flutter/*/.rs"]:
                  for f in glob.glob(pattern, recursive=True):
                      if patch_file(f):
                          count += 1

              print(f"Patched {count} files total")

              # Also patch config.rs specifically for KEY constant
              config_path = "libs/hbb_common/src/config.rs"
              if os.path.exists(config_path):
                  with open(config_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  # Try to replace the default public key
                  # Common patterns for the key constant
                  key_patterns = [
                      (r'(pub\s+const\s+KEY\s:\s&str\s=\s")[^"]*(")', rf'\g<1>{key}\g<2>'),
                      (r'(pub\s+const\s+RS_PUB_KEY\s:\s&str\s=\s")[^"]*(")', rf'\g<1>{key}\g<2>'),
                      (r'(pub\s+const\s+DEFAULT_PUBLIC_KEY\s:\s&str\s=\s")[^"]*(")', rf'\g<1>{key}\g<2>'),
                  ]
                  for pat, repl in key_patterns:
                      content, n = re.subn(pat, repl, content)
                      if n > 0:
                          print(f"  Replaced KEY constant ({n} occurrences)")
                  with open(config_path, "w", encoding="utf-8") as f:
                      f.write(content)

          - name: Setup MSVC
            uses: ilammy/msvc-dev-cmd@v1

          - name: Install opus dependency
            shell: cmd
            run: cd /d C:\ && C:\vcpkg\vcpkg.exe install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static dav1d:x64-windows-static
            timeout-minutes: 30
            
          - name: Build RustDesk (Release)
            shell: cmd
            run: |
              call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
              set RENDEZVOUS_SERVER=${{ secrets.RENDEZVOUS_SERVER }}
              set RS_PUB_KEY=${{ secrets.RS_PUB_KEY }}
              set PUBLIC_KEY=${{ secrets.RS_PUB_KEY }}
              set VCPKG_ROOT=C:\vcpkg
              cargo build --release
            timeout-minutes: 120

          - name: Upload artifact
            uses: actions/upload-artifact@v4
            with:
              name: rustdesk-private
              path: target/release/rustdesk.exe
              if-no-files-found: error
